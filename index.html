<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Viral Studio — Vos photos et vidéos deviennent virales</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
        --bg: #0a0a0f; --panel: #14141c; --panel-2: #1c1c28; --border: #2a2a3a;
        --ink: #f5f5fa; --ink-dim: #8888a0; --ink-faint: #4a4a5a;
        --success: #2dd36f; --error: #ff3b5c; --warn: #ffb800; --info: #7c5cff;
        --viral: #ff2d75; --viral-2: #7c5cff; --viral-3: #00e5ff;
        --radius: 14px;
    }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at 20% 0%, #1a0a2e 0%, #0a0a0f 45%, #0a0a0f 100%);
        color: var(--ink); min-height: 100vh;
        padding: 1.2rem 1rem 6rem; font-size: 15px; line-height: 1.5;
        max-width: 900px; margin: 0 auto;
    }
    header { margin-bottom: 1.4rem; text-align: center; }
    h1 {
        font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em;
        margin-bottom: 0.3rem;
        background: linear-gradient(120deg, #ff2d75, #7c5cff 50%, #00e5ff);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { font-size: 0.78rem; color: var(--ink-dim); letter-spacing: 0.05em; }

    .toast {
        position: fixed; top: 1.5rem; left: 50%;
        transform: translateX(-50%) translateY(-120px);
        background: #1c1c28; color: #fff;
        padding: 0.85rem 1.4rem; border-radius: 12px;
        font-size: 0.85rem; font-weight: 600;
        box-shadow: 0 8px 40px rgba(255,45,117,0.25);
        border: 1px solid rgba(255,255,255,0.1);
        z-index: 1000; opacity: 0;
        transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
        max-width: 90vw; text-align: center;
    }
    .toast.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--error); }
    .toast.warn { border-color: var(--warn); }

    .viral-banner {
        background: linear-gradient(135deg, rgba(255,45,117,0.15), rgba(124,92,255,0.15), rgba(0,229,255,0.15));
        border: 1px solid rgba(255,255,255,0.08);
        padding: 0.9rem 1rem; border-radius: 12px;
        font-size: 0.78rem; color: #d0d0e0;
        margin-bottom: 1rem; line-height: 1.5;
        position: relative; overflow: hidden;
    }

    .api-panel {
        background: var(--panel); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 1rem 1.1rem;
        margin-bottom: 1rem;
    }
    .api-panel.ok { border-color: var(--success); }

    .api-key-input {
        width: 100%; padding: 0.85rem 1rem;
        border-radius: 10px; border: 1px solid var(--border);
        background: #0a0a0f; color: var(--ink);
        font-size: 0.85rem; margin-bottom: 0.6rem;
    }

    .api-save-btn {
        width: 100%; padding: 0.8rem 1.2rem; border-radius: 10px; border: none;
        background: linear-gradient(90deg, var(--viral), var(--viral-2));
        color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }

    .api-status-line {
        font-size: 0.75rem; padding: 0.55rem 0.85rem; border-radius: 8px; margin-top: 0.5rem;
        display: flex; align-items: center; gap: 0.5rem; background: var(--panel-2); color: var(--ink-dim);
    }
    .api-status-line.ok { background: rgba(45,211,111,0.12); color: var(--success); font-weight: 600; }
    .api-status-line .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
    .api-status-line.ok .status-dot { background: var(--success); }

    .upload-zone {
        border: 2px dashed rgba(0,229,255,0.35); border-radius: var(--radius);
        padding: 2rem 1rem; text-align: center; cursor: pointer;
        background: linear-gradient(135deg, rgba(0,229,255,0.06), rgba(124,92,255,0.06));
    }
    .upload-icon { font-size: 2.4rem; margin-bottom: 0.6rem; }
    .upload-text { font-size: 0.98rem; color: var(--ink); font-weight: 600; margin-bottom: 0.2rem; }
    .upload-hint { font-size: 0.75rem; color: var(--ink-dim); }

    .images-grid {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.8rem; margin-top: 1rem;
    }
    .media-card {
        position: relative; border-radius: var(--radius); overflow: hidden;
        background: var(--panel-2); border: 1px solid var(--border);
        display: flex; flex-direction: column;
    }
    .media-card img, .media-card video { width: 100%; height: 140px; object-fit: cover; display: block; }
    .media-card .btn-ai {
        width: 100%; padding: 0.5rem; background: var(--viral); color: white;
        border: none; font-size: 0.75rem; font-weight: bold; cursor: pointer;
    }
</style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <header>
        <h1>Viral Studio</h1>
        <div class="subtitle">VOS MÉDIAS DEVIENNENT VIRAUX</div>
    </header>

    <div class="viral-banner">
        <strong>Boostez vos vidéos & photos !</strong> Importez vos fichiers pour retirer les filigranes ou optimiser le format.
    </div>

    <div class="api-panel" id="apiPanel">
        <input type="password" id="apiKeyInput" class="api-key-input" placeholder="Entrez votre clé API de traitement...">
        <button id="saveApiBtn" class="api-save-btn">Sauvegarder et Activer l'IA</button>
        <div class="api-status-line" id="apiStatusLine">
            <div class="status-dot"></div>
            <span id="apiStatusText">Statut de l'IA : Déconnectée</span>
        </div>
    </div>

    <div class="section open">
        <div class="section-header">
            <div class="section-title">Laboratoire Multimédia <span class="badge">Multi-Format</span></div>
        </div>
        <div class="section-body">
            <div class="section-content">
                <div class="upload-zone" id="uploadZone">
                    <!-- Acceptation des images ET des vidéos -->
                    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
                    <div class="upload-icon">🎬</div>
                    <div class="upload-text">Ajouter une photo ou une vidéo</div>
                    <div class="upload-hint">Formats : MP4, PNG, JPG, WebM</div>
                </div>
                <div class="images-grid" id="imagesGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const imagesGrid = document.getElementById('imagesGrid');
        const saveApiBtn = document.getElementById('saveApiBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const apiStatusLine = document.getElementById('apiStatusLine');
        const apiStatusText = document.getElementById('apiStatusText');
        const apiPanel = document.getElementById('apiPanel');
        const toast = document.getElementById('toast');

        let savedApiKey = localStorage.getItem('viral_studio_api_key') || '';
        
        if (savedApiKey) {
            apiKeyInput.value = '••••••••••••••••';
            activationVisuelleIA();
        }

        saveApiBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if(key && key !== '••••••••••••••••') {
                localStorage.setItem('viral_studio_api_key', key);
                savedApiKey = key;
                showToast('Clé API activée !', 'success');
                activationVisuelleIA();
            } else {
                showToast('Veuillez entrer une clé valide.', 'error');
            }
        });

        function activationVisuelleIA() {
            apiStatusLine.classList.add('ok');
            apiPanel.classList.add('ok');
            apiStatusText.innerText = 'Statut de l\'IA : Prête';
        }

        function showToast(message, type) {
            toast.innerText = message;
            toast.className = `toast visible ${type}`;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        uploadZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                const isVideo = file.type.startsWith('video/');
                
                reader.onload = function(event) {
                    creerCarteMedia(event.target.result, isVideo);
                };
                reader.readAsDataURL(file);
            }
        });

        function creerCarteMedia(src, isVideo) {
            const card = document.createElement('div');
            card.className = 'media-card';
            
            // Injection dynamique du bon tag HTML selon le type de fichier
            if (isVideo) {
                card.innerHTML = `
                    <video src="${src}" controls muted></video>
                    <button class="btn-ai">Optimiser la Vidéo ⚡</button>
                `;
            } else {
                card.innerHTML = `
                    <img src="${src}" alt="Photo">
                    <button class="btn-ai">Optimiser la Photo ✨</button>
                `;
            }
            
            card.querySelector('.btn-ai').addEventListener('click', () => {
                if(!savedApiKey) {
                    showToast('Veuillez connecter votre clé API.', 'warn');
                    return;
                }
                showToast('Traitement du média en cours...', 'success');
            });

            imagesGrid.appendChild(card);
        }
